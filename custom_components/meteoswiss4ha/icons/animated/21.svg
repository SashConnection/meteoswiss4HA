<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><style>
.rays,.glow,.spark,.cloud,.drop,.flake,.bolt,.star,.moon,.mglow,.fog{transform-box:fill-box;transform-origin:center}
.rays{animation:rays 14s linear infinite}
.glow{opacity:.35;animation:glow 2.6s ease-in-out infinite}
.spark{opacity:0;animation:twinkle 2.4s ease-in-out infinite}
.star{opacity:.25;animation:twinkle 2.8s ease-in-out infinite}
.cloud.d1{animation:cloud 6s ease-in-out infinite}
.cloud.d2{animation:cloud 8s ease-in-out infinite reverse}
.drop{opacity:0;animation:drop 1.1s linear infinite}
.drop.fast{animation-duration:.8s}
.flake{opacity:0;animation:flake 2.4s linear infinite}
.bolt{animation:bolt 3.2s linear infinite}
.moon{animation:moon 7s ease-in-out infinite}
.mglow{opacity:.2;animation:glow 4s ease-in-out infinite}
.fog.a{animation:fog 4s ease-in-out infinite}
.fog.b{animation:fog 5s ease-in-out infinite reverse}
@keyframes rays{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.18;transform:scale(.92)}50%{opacity:.5;transform:scale(1.12)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.1)}}
@keyframes cloud{0%,100%{transform:translateX(-3px)}50%{transform:translateX(4px)}}
@keyframes drop{0%{opacity:0;transform:translateY(-4px)}15%{opacity:1}100%{opacity:0;transform:translateY(20px)}}
@keyframes flake{0%{opacity:0;transform:translate(0,-4px)}20%{opacity:1}50%{transform:translate(3px,8px)}100%{opacity:0;transform:translate(-2px,20px)}}
@keyframes bolt{0%,64%,72%,100%{opacity:.45}66%,70%,76%{opacity:1}}
@keyframes moon{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes fog{0%,100%{transform:translateX(-5px)}50%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.drop,.flake,.bolt,.spark{opacity:1}.star{opacity:.8}}
</style><defs><radialGradient id="sun" cx="40%" cy="40%" r="60%"><stop offset="0" stop-color="#fff59d"/><stop offset="1" stop-color="#ffb300"/></radialGradient><radialGradient id="moon" cx="30%" cy="35%" r="70%"><stop offset="0" stop-color="#fffde7"/><stop offset="1" stop-color="#ffe082"/></radialGradient></defs><path class="drop fast" style="animation-delay:0.00s" fill="#29b6f6" stroke="#0277bd" stroke-width=".8" d="M30 73 q5 9 0 13 q-5 -4 0 -13z"/><circle class="flake" style="animation-delay:0.50s" cx="41" cy="77" r="3.6" fill="#e1f5fe" stroke="#29b6f6" stroke-width="1.3"/><path class="drop fast" style="animation-delay:0.54s" fill="#29b6f6" stroke="#0277bd" stroke-width=".8" d="M52 73 q5 9 0 13 q-5 -4 0 -13z"/><circle class="flake" style="animation-delay:1.50s" cx="63" cy="77" r="3.6" fill="#e1f5fe" stroke="#29b6f6" stroke-width="1.3"/><path class="drop fast" style="animation-delay:1.08s" fill="#29b6f6" stroke="#0277bd" stroke-width=".8" d="M74 73 q5 9 0 13 q-5 -4 0 -13z"/><g transform="translate(-12 -12) scale(0.8)"><g class="cloud d2"><g fill="#90a4ae" stroke="#90a4ae" stroke-width="3.8"><circle cx="38" cy="54" r="14"/><circle cx="55" cy="45" r="18"/><circle cx="71" cy="56" r="12"/><rect x="25" y="54" width="58" height="16" rx="8"/></g><g fill="#cfd8dc"><circle cx="38" cy="54" r="14"/><circle cx="55" cy="45" r="18"/><circle cx="71" cy="56" r="12"/><rect x="25" y="54" width="58" height="16" rx="8"/></g></g></g><g transform="translate(0 0) scale(1)"><g class="cloud d1"><g fill="#455a64" stroke="#455a64" stroke-width="3.0"><circle cx="38" cy="54" r="14"/><circle cx="55" cy="45" r="18"/><circle cx="71" cy="56" r="12"/><rect x="25" y="54" width="58" height="16" rx="8"/></g><g fill="#78909c"><circle cx="38" cy="54" r="14"/><circle cx="55" cy="45" r="18"/><circle cx="71" cy="56" r="12"/><rect x="25" y="54" width="58" height="16" rx="8"/></g></g></g></svg>
